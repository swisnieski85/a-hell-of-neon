# The four endings, in the order the title screen shows them. Each ending's
# End choice carries `ending: <id>`; reaching the end card records it, and
# the title screen's row (hidden until the first ending) fills that box.

endings:
  - id: redemption
    name: REDEMPTION
    description: The hard part is letting go.

  - id: quietism
    name: QUIETISM
    description: People don't change. Not really.

  - id: tragedy
    name: TRAGEDY
    description: There are worse ways to go.

  - id: nihilism
    name: NIHILISM
    description: Curse God and die.
